# Builds on GitHub Actions and deploys to Vercel with the Vercel CLI.
#   push to main  -> production deployment
#   pull request  -> preview deployment (URL posted in the job summary)
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      "orgId" in .vercel/project.json
#   VERCEL_PROJECT_ID  "projectId" in .vercel/project.json
#
# Environment variables (NEXT_PUBLIC_BACKEND_URL etc.) are pulled from the
# Vercel project settings by `vercel pull`, so add them there.

name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push cancels a deploy still running for the same branch.
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pick environment
        id: target
        run: |
          # Production only for main (push or manual run); PRs get a preview.
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "prod=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "prod=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings and env vars
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed (${{ steps.target.outputs.env }})" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
